# Seed data for the XYZ Software demo — the source of truth for the topic rules, users and projects.
#
# Access model: role × document type × TOPIC. Sections are tagged with a topic automatically from
# their heading (topic_headings); a role may read a section only if role_access lists its topic,
# and only in projects the user is a member of (the CEO reads every project).

company:
  id: xyz
  name: XYZ Software

projects:
  - id: P001
    name: Droob AI
    client: Droob (Business Owner)
    aliases: [Droob, Droob AI, Project Droob]
  - id: P002
    name: Hub Drives
    client: Hub Drives Mobility LLC
    aliases: [Hub Drives, HubDrives, car rental]

doc_types:
  brd: { label: Business Requirements Document }
  prd: { label: Product Requirements Document }
  proposal: { label: Proposal }

# Topics per document type. Every type also has:
#   details      — the cover block (version, status, prepared for); harmless metadata
#   commercial   — prices and payment lines, split out of other sections automatically
#   unclassified — headings that matched no keyword; CEO/PM only until someone picks a topic
topics:
  brd:
    details: Document details
    context: Context
    goals: Goals & objectives
    requirements: Requirements & scope
    business_rules: Business rules
    planning: Planning
    risks: Risks
    governance: Governance
    commercial: Commercial
    unclassified: Unclassified
  prd:
    details: Document details
    overview: Overview
    scope: Scope
    requirements: Requirements
    delivery: Delivery
    commercial: Commercial
    unclassified: Unclassified
  proposal:
    details: Document details
    summary: Summary
    scope: Scope & deliverables
    timeline: Timeline
    commercial: Commercial
    engagement: Engagement terms
    completion: Completion & approval
    unclassified: Unclassified

# Heading keyword → topic. Matched as whole words against the heading with its number removed;
# longer keywords win ("business rules" beats "rules"). Unmatched headings → unclassified.
topic_headings:
  brd:
    introduction: details
    document details: details
    executive summary: context
    business background: context
    background: context
    business problem: context
    problem: context
    target users: context
    proposed business solution: context
    proposed solution: context
    solution: context
    goals: goals
    objectives: goals
    success criteria: goals
    kpis: goals
    business scope: requirements
    scope: requirements
    business requirements: requirements
    requirements: requirements
    business process: requirements
    user journey: requirements
    business rules: business_rules
    rules: business_rules
    policies: business_rules
    assumptions: planning
    constraints: planning
    implementation: planning
    risks: risks
    stakeholders: governance
    sign off: governance
    future: governance
    commercial: commercial
    budget: commercial
  prd:
    introduction: details
    document details: details
    product overview: overview
    overview: overview
    problem statement: overview
    problem: overview
    product objectives: overview
    objectives: overview
    target users: overview
    scope: scope
    functional requirements: requirements
    non functional requirements: requirements
    requirements: requirements
    user flow: requirements
    user stories: requirements
    acceptance criteria: requirements
    success metrics: delivery
    kpis: delivery
    metrics: delivery
    dependencies: delivery
    risks: delivery
    release criteria: delivery
    future enhancements: delivery
    future: delivery
    commercial: commercial
  proposal:
    introduction: details
    document details: details
    executive summary: summary
    project objectives: summary
    objectives: summary
    proposed project scope: scope
    project scope: scope
    scope: scope
    delivery plans: scope
    deliverables: scope
    plan: scope
    timeline: timeline
    schedule: timeline
    commercial: commercial
    payment: commercial
    pricing: commercial
    investment: commercial
    project management: engagement
    communication: engagement
    client responsibilities: engagement
    responsibilities: engagement
    exclusions: engagement
    warranty: engagement
    support: engagement
    project completion: completion
    completion: completion
    approval: completion

# role → scope + topics it may read per document type ("*" = every topic).
role_access:
  ceo:
    scope: company
    topics: { brd: ["*"], prd: ["*"], proposal: ["*"] }
  pm:
    scope: assigned
    topics: { brd: ["*"], prd: ["*"], proposal: ["*"] }
  client:
    scope: assigned
    topics:
      brd: [details, context, goals, requirements, business_rules, planning, risks, governance, commercial]
      prd: [details, overview, scope, requirements, delivery, commercial]
      proposal: [details, summary, scope, timeline, commercial, engagement, completion]
  developer:
    scope: assigned
    topics:
      brd: [details, context, requirements]
      prd: [details, overview, scope, requirements, delivery]
      proposal: [details, scope, timeline]
  qa:
    scope: assigned
    topics:
      brd: [details, goals, business_rules]
      prd: [details, overview, scope, requirements, delivery]
      proposal: [details, scope, completion]
  finance:
    scope: assigned
    topics:
      brd: [details, goals, commercial]
      prd: [details, overview, scope, commercial]
      proposal: [details, summary, scope, timeline, commercial, engagement, completion]

role_labels:
  ceo: CEO
  pm: Project Manager
  developer: Developer
  qa: QA Engineer
  finance: Finance Manager
  client: Client

users:
  - { id: u-mona,    name: Mona,    email: mona@xyz.test,    role: ceo,       projects: [] }
  - { id: u-hamed,   name: Hamed,   email: hamed@xyz.test,   role: pm,        projects: [P001] }
  - { id: u-sara,    name: Sara,    email: sara@xyz.test,    role: developer, projects: [P001] }
  - { id: u-omar,    name: Omar,    email: omar@xyz.test,    role: qa,        projects: [P001] }
  - { id: u-khaled,  name: Khaled,  email: khaled@xyz.test,  role: finance,   projects: [P001] }
  - { id: u-amina,   name: Amina,   email: amina@droob.test, role: client,    projects: [P001], organization: Droob }
  - { id: u-youssef, name: Youssef, email: youssef@xyz.test, role: developer, projects: [P002] }
