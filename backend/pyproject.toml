[project]
name = "xyz-pm-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "psycopg[binary]>=3.2", "psycopg_pool>=3.2", "fastapi>=0.115", "uvicorn>=0.30", "pyjwt>=2.8", "bcrypt>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
